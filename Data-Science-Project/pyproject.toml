[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[project]
name = "Data-Science-Module"
version = "0.1.0"
description = "Financial Fraud Detection – Team 9"
authors = [
  { name = "Team-9" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.10,<4.0"

# ── Core runtime dependencies ──────────────────────────────────────────────────
dependencies = [
    # data wrangling
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<2.0",

    # statistics / ML
    "scipy>=1.13,<2.0",
    "scikit-learn>=1.5,<2.0",

    # visualisation
    "matplotlib>=3.8,<4.0",
    "seaborn>=0.13,<1.0",

    # utilities
    "loguru>=0.7,<1.0",
    "python-dotenv>=1.0,<2.0",
    "tqdm>=4.66,<5.0",
    "typer>=0.12,<1.0",

    # modelling
    "xgboost>=2.0.0,<3.0",
    "lightgbm>=4.0.0,<5.0",
    "imbalanced-learn>=0.11.0,<0.12.0", 
    "mlflow>=2.8.0,<3.0", 
    "fastapi (>=0.136.1,<0.137.0)", 
    "uvicorn[standard] (>=0.46.0,<0.47.0)", 
    "pydantic (>=2.13.3,<3.0.0)", 
    "joblib (>=1.5.3,<2.0.0)",   
]

# ── Dev / CI dependencies ─────────────────────────────────────────────────────
[tool.poetry.group.dev.dependencies]
pytest        = ">=8.0,<9.0"
pytest-cov    = ">=5.0,<6.0"
ruff          = ">=0.4,<1.0"
mkdocs        = ">=1.6,<2.0"
ipykernel     = ">=6.29,<7.0"
notebook      = ">=7.2,<8.0"

# ── Ruff (linter + formatter) ─────────────────────────────────────────────────
[tool.ruff]
line-length = 99
src         = ["Data_Science_Module"]
include     = ["pyproject.toml", "Data_Science_Module/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party          = ["Data_Science_Module"]
force-sort-within-sections = true

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
