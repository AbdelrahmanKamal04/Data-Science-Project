[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
name = "Data-Science-Module"
version = "0.1.0"
description = "Financial Fraud Detection – Team 9"
authors = ["Team-9"]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"

# Data wrangling
pandas = "^2.2"
numpy = "^1.26"

# Statistics / ML
scipy = "^1.13"
scikit-learn = "^1.5"

# Visualisation
matplotlib = "^3.8"
seaborn = "^0.13"

# Utilities
loguru = "^0.7"
python-dotenv = "^1.0"
tqdm = "^4.66"
typer = "^0.12"

# Modelling
xgboost = "^2.0"
lightgbm = "^4.0"
imbalanced-learn = "^0.11"
mlflow = "^2.8"

# API
fastapi = "^0.136"
uvicorn = { version = "^0.46", extras = ["standard"] }
pydantic = "^2.10"
joblib = "^1.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"
ruff = "^0.4"
mkdocs = "^1.6"
ipykernel = "^6.29"
notebook = "^7.2"

# Ruff configuration
[tool.ruff]
line-length = 99
src = ["Data_Science_Module"]
include = ["pyproject.toml", "Data_Science_Module/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["Data_Science_Module"]
force-sort-within-sections = true

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"